<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- 공통 정의: 12개 꽃잎과 얼굴 바탕 -->
  <defs>
    <!-- 해바라기 12개 둥근 꽃잎 템플릿 -->
    <g id="flower-petals">
      <!-- 30도 간격으로 회전된 12개의 노란 타원형 꽃잎 -->
      <ellipse cx="50" cy="12" rx="7" ry="12" fill="#f2c200" stroke="#111111" stroke-width="2.5" />
      <ellipse cx="50" cy="12" rx="7" ry="12" fill="#f2c200" stroke="#111111" stroke-width="2.5" transform="rotate(30 50 50)" />
      <ellipse cx="50" cy="12" rx="7" ry="12" fill="#f2c200" stroke="#111111" stroke-width="2.5" transform="rotate(60 50 50)" />
      <ellipse cx="50" cy="12" rx="7" ry="12" fill="#f2c200" stroke="#111111" stroke-width="2.5" transform="rotate(90 50 50)" />
      <ellipse cx="50" cy="12" rx="7" ry="12" fill="#f2c200" stroke="#111111" stroke-width="2.5" transform="rotate(120 50 50)" />
      <ellipse cx="50" cy="12" rx="7" ry="12" fill="#f2c200" stroke="#111111" stroke-width="2.5" transform="rotate(150 50 50)" />
      <ellipse cx="50" cy="12" rx="7" ry="12" fill="#f2c200" stroke="#111111" stroke-width="2.5" transform="rotate(180 50 50)" />
      <ellipse cx="50" cy="12" rx="7" ry="12" fill="#f2c200" stroke="#111111" stroke-width="2.5" transform="rotate(210 50 50)" />
      <ellipse cx="50" cy="12" rx="7" ry="12" fill="#f2c200" stroke="#111111" stroke-width="2.5" transform="rotate(240 50 50)" />
      <ellipse cx="50" cy="12" rx="7" ry="12" fill="#f2c200" stroke="#111111" stroke-width="2.5" transform="rotate(270 50 50)" />
      <ellipse cx="50" cy="12" rx="7" ry="12" fill="#f2c200" stroke="#111111" stroke-width="2.5" transform="rotate(300 50 50)" />
      <ellipse cx="50" cy="12" rx="7" ry="12" fill="#f2c200" stroke="#111111" stroke-width="2.5" transform="rotate(330 50 50)" />
    </g>
  </defs>

  <!-- 1. 긍정 표정 (face-positive): 웃는 눈과 활짝 웃는 입 -->
  <symbol id="face-positive" viewBox="0 0 100 100">
    <use href="#flower-petals" />
    <!-- 분홍색 원형 얼굴 -->
    <circle cx="50" cy="50" r="32" fill="#f29bb5" stroke="#111111" stroke-width="3" />
    <!-- 웃는 반달 눈 (좌/우) -->
    <path d="M 38 46 Q 42 39 46 46" fill="none" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 54 46 Q 58 39 62 46" fill="none" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
    <!-- 활짝 웃는 반원형 입과 혓바닥 -->
    <path d="M 40 54 Q 50 68 60 54 Z" fill="#111111" />
    <path d="M 45 61 Q 50 66 55 61" fill="#ff5a5f" />
    <!-- 볼터치 -->
    <circle cx="36" cy="52" r="3.5" fill="#f07f3f" opacity="0.6" />
    <circle cx="64" cy="52" r="3.5" fill="#f07f3f" opacity="0.6" />
  </symbol>

  <!-- 2. 부정 표정 (face-negative): 처진 눈과 찡그린 입 -->
  <symbol id="face-negative" viewBox="0 0 100 100">
    <use href="#flower-petals" />
    <circle cx="50" cy="50" r="32" fill="#f29bb5" stroke="#111111" stroke-width="3" />
    <!-- 아래로 처진 눈 (좌/우) -->
    <path d="M 38 42 L 46 47" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 62 42 L 54 47" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="42" cy="46" r="2.5" fill="#111111" />
    <circle cx="58" cy="46" r="2.5" fill="#111111" />
    <!-- 시무룩하게 굽은 입 -->
    <path d="M 41 62 Q 50 53 59 62" fill="none" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
  </symbol>

  <!-- 3. 중립 표정 (face-neutral): 일직선 눈과 일직선 입 -->
  <symbol id="face-neutral" viewBox="0 0 100 100">
    <use href="#flower-petals" />
    <circle cx="50" cy="50" r="32" fill="#f29bb5" stroke="#111111" stroke-width="3" />
    <!-- 일직선 가로 줄 눈 (좌/우) -->
    <line x1="38" y1="46" x2="46" y2="46" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
    <line x1="54" y1="46" x2="62" y2="46" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
    <!-- 일직선 입 -->
    <line x1="42" y1="58" x2="58" y2="58" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
  </symbol>
</svg>

